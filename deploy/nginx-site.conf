# Include inside the existing HTTPS server for cheshashlik.ru.
# Keep its root, listen, TLS certificates and ACME settings. Replace conflicting
# location / and static-file locations with this file; do not append duplicates.

index index.html;
charset utf-8;
autoindex off;
error_page 404 /404.html;

# Safe use of "if": only a return, including when both names share a TLS server.
if ($host = www.cheshashlik.ru) {
    return 301 https://cheshashlik.ru$request_uri;
}

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location = /index.html {
    return 301 https://cheshashlik.ru/$is_args$args;
}
location ~ ^/(menu|shashlyk)(/index\.html|/|\.html)?$ {
    return 301 "https://cheshashlik.ru/$is_args$args#menu";
}
location ~ ^/privacy(/|\.html/)?$ {
    return 301 https://cheshashlik.ru/privacy.html$is_args$args;
}
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-store" always;
}
location = /README.md { return 404; }
location ~ /\.(?!well-known/) { return 404; }
# Document root on cheshashlik.ru is a git checkout of shashlik-bridge:
# its build scripts and package files are not part of the site.
location ~ ^/(scripts|node_modules)/ { return 404; }
location ~ ^/(package(-lock)?\.json|vite\.config\.js)$ { return 404; }

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
location ~* \.(css|js)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
location ~* \.woff2$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~* \.(jpg|jpeg|png|webp|avif|ico|svg|pdf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
